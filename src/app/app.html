<div class="container-fluid">
  <div class="row min-vh-100">

    <!-- Sidebar -->
    <aside class="col-2 bg-light border-end p-3">
      <app-main-menu (dialogRequested)="openModal($event)"></app-main-menu>
    </aside>

    <!-- Main content -->
    <main class="col-8 p-4 bg-white">
      <app-people-table #peopleTable></app-people-table>
      <app-statistics (statsChanged)="onStatsChanged($event)" (filterRequested)="onFilterRequested($event)"></app-statistics>
    </main>

    <!-- Right statistics panel -->
    <aside class="col-2 bg-light border-start p-3 d-flex flex-column align-items-start">
      <app-statistics-panel [statsResults]="statsResults" ></app-statistics-panel>
    </aside>

  </div>
</div>

<app-person-form></app-person-form>
