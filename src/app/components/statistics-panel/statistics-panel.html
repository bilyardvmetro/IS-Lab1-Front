<div class="stats-panel card shadow-sm p-3 bg-light">
  <h5 class="fw-bold mb-3 text-center">Результаты статистики</h5>

  <div class="mb-3">
    <label class="form-label">Средний рост</label>
    <input class="form-control" [value]="statsResults?.averageHeight" readonly>
  </div>

  <div class="mb-3">
    <label class="form-label">Кол-во по национальности</label>
    <input class="form-control" [value]="statsResults?.countByNationality" readonly>
  </div>

  <div class="mb-3">
    <label class="form-label">Процент по цвету глаз</label>
    <input class="form-control" [value]="statsResults?.percentageByEyeColor" readonly>
  </div>

  <div class="mb-3">
    <label class="form-label">Кол-во по цвету волос и локации</label>
    <input class="form-control" [value]="statsResults?.hairLocationCount" readonly>
  </div>
</div>
