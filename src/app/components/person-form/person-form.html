<div class="modal fade" id="createPersonModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Создать Person</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        @if (errorMessages.length > 0) {
          <div class="alert alert-danger" role="alert">
            <h6 class="alert-heading">Пожалуйста, исправьте следующие ошибки:</h6>
            <ul>
              @for (msg of errorMessages; track msg) {
                <li>{{ msg }}</li>
              }
            </ul>
          </div>
        }

        <form [formGroup]="personForm" class="row g-3">

          <div class="col-md-6">
            <label class="form-label">Имя</label>
            <input type="text" class="form-control" formControlName="name" placeholder="Введите имя">
          </div>

          <div class="col-md-6">
            <label class="form-label">Serial Number</label>
            <input type="text" class="form-control" formControlName="serialNumber" placeholder="SN-0001">
          </div>


          <div class="col-md-6">
            <label class="form-label">Рост</label>
            <input type="number" class="form-control" formControlName="height" placeholder="Рост в см">
          </div>

          <div class="col-md-6">
            <label class="form-label">Вес</label>
            <input type="number" class="form-control" formControlName="weight" placeholder="Вес в кг">
          </div>

          <div class="col-md-6">
            <label class="form-label">Национальность</label>
            <select class="form-select" formControlName="nationality">
              <option value="RUSSIA">Russia</option>
              <option value="NORTH_KOREA">North Korea</option>
              <option value="JAPAN">Japan</option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label">Цвет волос</label>
            <select class="form-select" formControlName="hairColor">
              <option value="RED">Red</option>
              <option value="YELLOW">Yellow</option>
              <option value="ORANGE">Orange</option>
              <option value="WHITE">White</option>
              <option value="BROWN">Brown</option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label">Цвет глаз</label>
            <select class="form-select" formControlName="eyeColor">
              <option value="RED">Red</option>
              <option value="YELLOW">Yellow</option>
              <option value="ORANGE">Orange</option>
              <option value="WHITE">White</option>
              <option value="BROWN">Brown</option>
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label">Id Паспорта</label>
            <input type="text" class="form-control" formControlName="passportID" placeholder="Id паспорта">
          </div>

          <hr class="mt-4">

          <!-- Coordinates Section -->
          <div formGroupName="coordinates" class="mt-3">
            <h6>Координаты</h6>

            <div class="row">
              <div class="col-md-6">
                <label class="form-label">X</label>
                <input type="number" class="form-control" formControlName="x">
              </div>
              <div class="col-md-6">
                <label class="form-label">Y</label>
                <input type="number" class="form-control" formControlName="y">
              </div>
            </div>
          </div>

          <hr class="mt-4">

          <!-- Location Section -->
          <div formGroupName="location" class="mt-3">
            <h6>Локация</h6>

            <div class="row">
              <div class="col-md-3">
                <label class="form-label">X</label>
                <input type="number" class="form-control" formControlName="x">
              </div>
              <div class="col-md-3">
                <label class="form-label">Y</label>
                <input type="number" class="form-control" formControlName="y">
              </div>
              <div class="col-md-3">
                <label class="form-label">Z</label>
                <input type="number" class="form-control" formControlName="z">
              </div>
              <div class="col-md-3">
                <label class="form-label">Название</label>
                <input type="text" class="form-control" formControlName="name" placeholder="Название локации">
              </div>
            </div>
          </div>

        </form>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
        <button type="button" class="btn btn-primary" (click)="onSave()">Сохранить</button>
      </div>

    </div>
  </div>
</div>
